<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
          background: #2b2b2b;
          color: #d1d5db;
          font-family: "Share Tech Mono", monospace;

          display: flex;
          justify-content: center;
          align-items: flex-start;

          min-height: 100vh;
          margin: 0;
          padding: 30px 0;
          overflow-y: auto;
      }

      .container {
        width: 720px;
      }

      .title {
        font-family: "Orbitron", sans-serif;
        font-size: 34px;
        text-align: center;
        margin-bottom: 25px;
        letter-spacing: 3px;
        color: #9ca3af;
        text-transform: uppercase;
      }

      textarea,
      #output {
        width: 100%;
        height: 220px;
        border: none;
        border-radius: 10px;
        padding: 18px;
        box-sizing: border-box;
        font-size: 16px;
        margin-bottom: 18px;
        background: #3a3a3a;
        color: #e5e7eb;
        outline: none;
        border: 1px solid #555;
  	resize: horizontal;
	overflow: auto;
	min-width: 300px;
      }

      #input {
  	white-space: nowrap;
  	overflow-x: auto;
  	overflow-y: auto;
      }

      #output {
        white-space: pre;
        overflow-x: auto;
        overflow-y: auto;
        background: #2f2f2f;
        color: #cbd5e1;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #4b5563;
        color: #e5e7eb;
        font-size: 16px;
        font-family: "Orbitron", sans-serif;
        letter-spacing: 2px;
        cursor: pointer;
        transition: 0.2s;
        margin-bottom: 10px;
      }

      button:hover {
        background: #6b7280;
      }

      .clear-btn {
        background: #374151;
      }

      .clear-btn:hover {
        background: #52525b;
      }

      .copy-btn {
        background: #1f2937;
      }

      .copy-btn:hover {
        background: #374151;
      }

      .options {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 18px;
      }

      .option {
        display: flex;
        flex-direction: column;
      }

      .option label {
        margin-bottom: 6px;
        color: #cbd5e1;
      }

      .option input {
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #555;
        background: #3a3a3a;
        color: #e5e7eb;
        font-family: inherit;
        font-size: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="title">Pretty Secure Formatter</div>

      <textarea id="input" placeholder="Enter input..."></textarea>

      <div class="options">
        <div class="option">
          <label for="columns">Columns</label>
          <input type="number" id="columns" min="1" step="1" value="2">
        </div>

        <div class="option">
          <label for="width">Width</label>
          <input type="number" id="width" min="1" step="1" value="80">
        </div>

        <div class="option">
          <label for="gap">Gap</label>
          <input type="number" id="gap" min="0" step="1" value="2">
        </div>

        <div class="option">
          <label for="lines">Lines</label>
          <input type="number" id="lines" min="1" step="1" value="25">
        </div>
      </div>

      <div id="output">output will appear here...</div>

      <button onclick="sendData()">SUBMIT</button>
      <button class="clear-btn" onclick="clearAll()">CLEAR</button>
      <button class="copy-btn" onclick="copyOutput()">COPY OUTPUT</button>
    </div>

    <script>
      async function sendData() {
        const columns = Number(document.getElementById("columns").value);
        const width = Number(document.getElementById("width").value);
        const gap = Number(document.getElementById("gap").value);
        const lines = Number(document.getElementById("lines").value);

        if (!Number.isInteger(columns) || columns <= 0) {
          alert("Columns must be > 0");
          return;
        }

        if (!Number.isInteger(width) || width <= 0) {
          alert("Width must be > 0");
          return;
        }

        if (!Number.isInteger(lines) || lines <= 0) {
          alert("Lines must be > 0");
          return;
        }

        if (!Number.isInteger(gap) || gap < 0) {
          alert("Gap must be ≥ 0");
          return;
        }

        const payload = {
          text: document.getElementById("input").value,
          columns,
          width,
          gap,
          lines
        };

        const response = await fetch("/cgi-bin/run.cgi", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(payload),
        });

        document.getElementById("output").innerText = await response.text();
      }

      function clearAll() {
        document.getElementById("input").value = "";
        document.getElementById("output").innerText = "";
      }

      function copyOutput() {
        const text = document.getElementById("output").innerText;

        navigator.clipboard
          .writeText(text)
          .then(() => alert("Output copied to clipboard"))
          .catch((err) => {
            alert("Copy failed");
            console.error(err);
          });
      }
    </script>
  </body>
</html>
