<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: #2b2b2b;
        color: #d1d5db;
        font-family: "Share Tech Mono", monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        width: 720px;
      }

      .title {
        font-family: "Orbitron", sans-serif;
        font-size: 34px;
        text-align: center;
        margin-bottom: 25px;
        letter-spacing: 3px;
        color: #9ca3af;
        text-transform: uppercase;
      }

      textarea,
      #output {
        width: 100%;
        height: 220px;
        border: none;
        border-radius: 10px;
        padding: 18px;
        box-sizing: border-box;
        font-size: 16px;
        margin-bottom: 18px;
        background: #3a3a3a;
        color: #e5e7eb;
        outline: none;
        border: 1px solid #555;
      }

      #output {
        background: #2f2f2f;
        white-space: pre-wrap;
        overflow: auto;
        color: #cbd5e1;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #4b5563;
        color: #e5e7eb;
        font-size: 16px;
        font-family: "Orbitron", sans-serif;
        letter-spacing: 2px;
        cursor: pointer;
        transition: 0.2s;
        margin-bottom: 10px;
      }

      button:hover {
        background: #6b7280;
      }

      /* styles per differenziare */
      .clear-btn {
        background: #374151;
      }

      .clear-btn:hover {
        background: #52525b;
      }

      .copy-btn {
        background: #1f2937;
      }

      .copy-btn:hover {
        background: #374151;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="title">Pretty Secure Formatter</div>
      <textarea id="input" placeholder="Enter input..."></textarea>
      <div id="output">output will appear here...</div>
      <button onclick="sendData()">SUBMIT</button>
      <button class="clear-btn" onclick="clearAll()">CLEAR</button>
      <button class="copy-btn" onclick="copyOutput()">COPY OUTPUT</button>
    </div>

    <script>
      async function sendData() {
        const text = document.getElementById("input").value;

        const response = await fetch("/cgi-bin/run.cgi", {
          method: "POST",
          headers: {
            "Content-Type": "text/plain",
          },
          body: text,
        });

        const result = await response.text();

        document.getElementById("output").innerText = result;
      }

      function clearAll() {
        document.getElementById("input").value = "";
        document.getElementById("output").innerText = "";
      }

      function copyOutput() {
        const text = document.getElementById("output").innerText;

        navigator.clipboard
          .writeText(text)
          .then(() => {
            alert("Output copied to clipboard");
          })
          .catch((err) => {
            alert("Copy failed");
            console.error(err);
          });
      }
    </script>
  </body>
</html>
