<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ftext</title>

<style>
    body {
        background: #0f172a;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: white;
    }

    .container {
        width: 700px;
    }

    textarea, .output {
        width: 100%;
        height: 220px;
        border: none;
        border-radius: 15px;
        padding: 20px;
        box-sizing: border-box;
        font-size: 18px;
        margin-bottom: 20px;
    }

    textarea {
        background: #1e293b;
        color: white;
        resize: none;
        outline: none;
    }

    .output {
        background: #111827;
        overflow-y: auto;
        white-space: pre-wrap;
    }

    button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: #3b82f6;
        color: white;
        font-size: 18px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #2563eb;
    }
</style>
</head>

<body>

<div class="container">

    <textarea id="inputText" placeholder="Scrivi qualcosa..."></textarea>

    <div class="output" id="outputBox">
        Insert text..
    </div>

    <button onclick="sendData()">Send</button>

</div>

<script>
async function sendData() {
    const text = document.getElementById("inputText").value;
    const response = await fetch("http://localhost:8000/process", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ text })
    });
    const data = await response.json();
    document.getElementById("outputBox").innerText = data.result;
}
</script>

</body>
</html>
